<script>
const main=document.getElementById('main'),chat=document.getElementById('chat'),thread=document.getElementById('thread');let view='home',timer;const steps=(active)=>`<nav class="stepbar" aria-label="Role journey"><button data-go="review" class="${active==='review'?'selected':''}">01 &nbsp; Review fit</button><button data-go="cv" class="${active==='cv'?'selected':''}">02 &nbsp; Prepare</button><button data-action="track">03 &nbsp; Track progress</button></nav>`;const heading=()=>`<button class="back" data-go="home">← All your roles</button><div class="row role-title-row"><div><div class="overline">Northstar Labs</div><h1 class="role-title">Head of Go-to-Market</h1><div class="muted">London · Hybrid · £110k–£140k · Sample role</div></div><button class="btn chat-toggle" data-action="chat">Talk to Oppa</button></div>`;
const screens={home:()=>`<div class="home"><div class="intro"><div><div class="overline">Your next chapter</div><h1>A little closer, every day.</h1><p class="muted">One good decision. Then the next.</p></div><button class="btn" data-action="add">+ Add a role</button></div><section class="feature"><div class="feature-copy"><span class="overline">Your next useful step</span><h2>Let’s finish your Northstar application.</h2><p>You’ve got a strong story for this role. Let’s check one open question, then get your CV ready.</p><button class="btn primary" data-go="review">Continue with Oppa <span aria-hidden="true">→</span></button></div><img class="portrait" src="/assets/career-oppa-character-adult.png" alt="Oppa, your career companion"></section><div class="row sectionline"><h2>The roles on your mind</h2><span class="muted">3 active roles</span></div><div class="roles"><article class="role"><div class="row"><div class="company plum">N</div><span class="tag">Ready to review</span></div><h3>Head of Go-to-Market</h3><small>Northstar Labs · London</small><p>Strong launch experience. One question about pricing ownership.</p><button class="textbtn" data-go="review">Continue review →</button></article><article class="role"><div class="row"><div class="company">F</div><span class="tag gray">Saved</span></div><h3>Founding Growth Lead</h3><small>Fieldnote · Remote</small><p>A hands-on growth role. Worth comparing with your priorities.</p><button class="textbtn" data-action="other-role">Review when you’re ready →</button></article><article class="role"><div class="row"><div class="company">M</div><span class="tag gray">Applied</span></div><h3>Director of Partnerships</h3><small>Meridian · London</small><p>Application sent three days ago. Give it a little breathing room.</p><button class="textbtn" data-action="track">See your progress →</button></article></div><p class="footnote">variables.css design variant · fictional roles and CV · changes last only until you refresh.</p></div>`,review:()=>`<div class="workspace">${heading()}${steps('review')}<div class="verdict"><span class="overline">Oppa’s take</span><h2>Worth your time. With one thing to check.</h2><p>The role asks you to build a growth function from the ground up. Your launch and partnership experience supports that. Direct ownership of pricing is still an open question.</p></div><div class="row"><h2>The story behind the fit</h2><span class="muted">Sample evidence</span></div><div class="evidence"><article><div class="label">A STRONG CONNECTION</div><h3>You’ve built from the beginning.</h3><p>The role needs someone who can turn an early idea into a repeatable growth program. Your launch work is a useful example.</p></article><article><div class="label">A STRONG CONNECTION</div><h3>You work across teams.</h3><p>Partnerships and cross-team delivery connect well to a role spanning sales, marketing and product.</p></article><article><div class="label question">LET’S CHECK THIS</div><h3>Have you owned pricing?</h3><p>It appears in the job description, but we haven’t confirmed it in your experience. It should stay out of your CV until we do.</p><button class="textbtn" data-prompt="Help me think through my pricing experience">Talk this through with Oppa →</button></article><article><div class="label question">YOUR PERSONAL FIT</div><h3>Does the day-to-day appeal?</h3><p>This is a hands-on role at a small company. Consider the level of uncertainty and how much you want to build yourself.</p></article></div><div class="decision"><span>You choose what deserves your energy.</span><button class="btn" data-action="later">Save for later</button><button class="btn primary" data-go="cv">Pursue & prepare my CV →</button></div></div>`,cv:()=>`<div class="workspace">${heading()}${steps('cv')}<div class="document-tools"><div><h2>Your story, tailored to this role.</h2><p>Highlighted text shows the focus of this sample draft.</p></div><a class="btn" href="output/pdf/career-oppa-sample-cv.pdf" target="_blank" rel="noopener">Open sample PDF ↗</a></div><div class="notice">Pricing ownership is left out. Only include experience you can explain and support.</div><article class="cv" aria-label="Sample tailored CV"><h2>Alex Morgan</h2><div>Go-to-market & growth leader</div><p class="contact">London, UK · alex@example.com · Fictional profile</p><h3>Profile</h3><p>Growth leader who connects customer insight, partnerships and product launches. Experienced in <span class="highlight">building early growth programs</span> and bringing teams together to turn strategy into delivery.</p><h3>Experience</h3><div class="row"><strong>Growth Lead · Example Studio</strong><small>2022–2026</small></div><ul><li>Led a product launch from initial customer research through positioning and cross-team delivery.</li><li><span class="highlight">Built a partner program</span> connecting sales and product teams around shared customer needs.</li><li>Introduced a regular review of experiments so the team could make decisions from evidence.</li></ul><div class="row"><strong>Partnerships Manager · Sample Company</strong><small>2019–2022</small></div><ul><li>Developed partner relationships and coordinated launch plans across commercial teams.</li><li>Translated customer feedback into practical changes to messaging and onboarding.</li></ul><h3>Relevant strengths</h3><p>Go-to-market planning · Partnerships · Product launches · Cross-team leadership · Growth experiments</p><h3>Education</h3><p>BA Business Management · Example University</p><p class="contact">Fictional CV for layout review. The linked PDF is a separate sample export.</p></article><div class="decision"><span>Ready when you’ve checked every claim.</span><button class="btn" data-prompt="Help me improve the opening paragraph">Refine with Oppa</button><button class="btn primary" data-action="track">Looks good — next step →</button></div></div>`};
function say(text){clearTimeout(timer);const t=document.getElementById('toast');t.textContent=text;t.hidden=false;timer=setTimeout(()=>t.hidden=true,4500)}function showChat(){chat.hidden=false;document.getElementById('chat-switch').setAttribute('aria-current','page')}function render(next){view=next;main.innerHTML=screens[next]();main.classList.toggle('resume-mode',next==='cv');if(next==='cv')prepareResumeScroll();main.scrollTop=0;chat.hidden=next==='home'||innerWidth<=700;document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.go===next));thread.innerHTML=`<div class="message"><div class="name">OPPA</div><p>${next==='cv'?'This draft brings your launch and partnership work forward. It leaves pricing claims out until you confirm them.':'You don’t need to tick every box. Let’s understand the gaps and decide whether this role is worth your time.'}</p><p>${next==='cv'?'Read the opening paragraph out loud. Does it sound like something you would say?':'What feels most uncertain about the role?'}</p></div><button class="prompt" data-prompt="What is the biggest gap?">What is the biggest gap?</button><br><button class="prompt" data-prompt="Help me improve the opening paragraph">Help me tell my story</button>`}
function prepareResumeScroll(){
 const workspace=main.firstElementChild;workspace.classList.add('resume-workspace');
 const children=[...workspace.children];const header=document.createElement('div');header.className='resume-heading';header.append(...children.splice(0,3));
 const actions=children.find(n=>n.classList.contains('decision'));
 const content=document.createElement('section');content.className='resume-scroll';content.tabIndex=0;content.setAttribute('aria-label','Resume preview');content.append(...children.filter(n=>n!==actions));
 workspace.replaceChildren(header,content);if(actions)workspace.append(actions);
}
const originalRender=render;
let layoutFrame;
render=function(next){originalRender(next);requestAnimationFrame(buildFixedWorkspace)};
function buildFixedWorkspace(){
 const wrapper=main.firstElementChild;if(!wrapper||view==='cv')return;
 const old=wrapper.querySelector('.fixed-stage');
 if(old){paginateWorkspace();return}
 const heading=document.createElement('div');heading.className='fixed-heading';
 const items=[];let decision=null;
 const children=[...wrapper.children];
 if(view==='home'){heading.append(children.shift())}else{heading.append(...children.splice(0,3))}
 for(const node of children){
  if(node.classList.contains('decision')){decision=node;continue}
  if(node.classList.contains('evidence')||node.classList.contains('roles')){
   const groupSize=innerWidth>1100?2:1;const cards=[...node.children];
   while(cards.length){const group=document.createElement('div');group.className=node.className;group.append(...cards.splice(0,groupSize));items.push(group)}
  }else if(node.classList.contains('cv')){
   const chunks=[];let chunk=[];
   for(const part of [...node.children]){if(part.tagName==='H3'&&chunk.length){chunks.push(chunk);chunk=[]}chunk.push(part)}if(chunk.length)chunks.push(chunk);
   for(const chunk of chunks){
    // Experience entries become separate document pages instead of overflowing.
    if(chunk[0].textContent==='Experience'){
     const parts=chunk.slice(1);while(parts.length){const article=document.createElement('article');article.className='cv';article.append(chunk[0].cloneNode(true),...parts.splice(0,2));items.push(article)}
    }else{const article=document.createElement('article');article.className='cv';article.append(...chunk);items.push(article)}
   }
  }else items.push(node)
 }
 const stage=document.createElement('div');stage.className='fixed-stage';
 const pager=document.createElement('nav');pager.className='workspace-pager';pager.setAttribute('aria-label','Workspace pages');pager.innerHTML='<button class="btn" type="button">← Previous</button><span aria-live="polite"></span><button class="btn" type="button">Next →</button>';
 wrapper.replaceChildren(heading,stage,pager);if(decision)wrapper.append(decision);
 wrapper._items=items;wrapper._page=0;
 pager.firstElementChild.onclick=()=>displayPage(wrapper,wrapper._page-1);
 pager.lastElementChild.onclick=()=>displayPage(wrapper,wrapper._page+1);
 paginateWorkspace();
}
function paginateWorkspace(){
 const wrapper=main.firstElementChild;if(!wrapper?._items)return;
 const stage=wrapper.querySelector('.fixed-stage');stage.replaceChildren();const pages=[];
 let page=document.createElement('section');page.className='workspace-page';stage.append(page);
 for(const node of wrapper._items){
  page.append(node);
  if(page.getBoundingClientRect().height>stage.clientHeight&&page.children.length>1){node.remove();pages.push(page);page.hidden=true;page=document.createElement('section');page.className='workspace-page';stage.append(page);page.append(node)}
 }
 if(page.children.length)pages.push(page);wrapper._pages=pages;displayPage(wrapper,Math.min(wrapper._page,pages.length-1));
}
function displayPage(wrapper,index){
 const pages=wrapper._pages;if(index<0||index>=pages.length)return;wrapper._page=index;
 pages.forEach((p,i)=>p.hidden=i!==index);const pager=wrapper.querySelector('.workspace-pager');pager.children[1].textContent=`${index+1} of ${pages.length}`;pager.firstElementChild.disabled=index===0;pager.lastElementChild.disabled=index===pages.length-1;
}
new ResizeObserver(()=>{cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>{if(main.firstElementChild?.querySelector('.fixed-stage'))paginateWorkspace()})}).observe(main);
function send(text){showChat();const msg=document.createElement('div');msg.className='message user-message';msg.textContent=text;thread.append(msg);const answer=document.createElement('div');answer.className='message';const name=document.createElement('div');name.className='name';name.textContent='OPPA · SAMPLE REPLY';const p=document.createElement('p');p.textContent=/pricing|gap/i.test(text)?'Think of a time you helped decide what a customer would pay. Did you make the final decision, provide research, or carry out someone else’s plan? Each is useful, but the CV should describe your actual part.':/opening|story/i.test(text)?'Start with what you build and who it helps. A possible opening: “I build growth programs that connect product, partnerships and sales.” Keep it only if it reflects your experience.':'We would work through this using your confirmed experience and the role’s requirements. This preview uses sample replies so you can try the conversation flow.';answer.append(name,p);thread.append(answer);thread.scrollTop=thread.scrollHeight}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){render(go.dataset.go);return}const prompt=e.target.closest('[data-prompt]');if(prompt){send(prompt.dataset.prompt);return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'chat':showChat();break;case'add':document.getElementById('add-modal').showModal();break;case'later':render('home');say('Saved for later in this preview.');break;case'track':say('Next: apply on the employer’s site, then record the date. Tracking is outside this three-screen mock.');break;case'other-role':say('This concept demonstrates the Northstar role. Open its review to try the full flow.');break}});document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('message');if(input.value.trim())send(input.value.trim());input.value=''});document.getElementById('close-chat').onclick=()=>chat.hidden=true;document.getElementById('work-switch').onclick=()=>chat.hidden=true;document.getElementById('chat-switch').onclick=showChat;document.getElementById('cancel-add').onclick=()=>document.getElementById('add-modal').close();document.getElementById('submit-add').onclick=()=>{document.getElementById('add-modal').close();render('review')};render('home');
</script></body></html>
