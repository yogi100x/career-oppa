button></td></tr></tbody></table></div></section><p class="footnote">variables.css design variant · fictional roles and CV · changes last only until you refresh.</p></div>`,review:()=>`<div class="workspace">${heading()}${steps('review')}<div class="verdict"><span class="overline">Oppa’s take · Sample fit score: 9.4</span><h2>Worth your time. With one thing to check.</h2><p>The role asks you to build a growth function from the ground up. Your launch and partnership experience supports that. Direct ownership of pricing is still an open question.</p></div><section class="fit-table-section"><div class="row sectionline"><h2>The story behind the fit</h2><span class="muted">Sample evidence</span></div><div class="fit-table-wrap"><table class="fit-table"><caption class="sr-only">Evidence and questions behind the role fit</caption><thead><tr><th scope="col">Fit area</th><th scope="col">Assessment</th><th scope="col">Why it matters</th></tr></thead><tbody><tr><th scope="row">Building from the beginning</th><td><span class="fit-label strong">Strong connection</span></td><td>The role needs someone who can turn an early idea into a repeatable growth program. Your launch work is a useful example.</td></tr><tr><th scope="row">Working across teams</th><td><span class="fit-label strong">Strong connection</span></td><td>Partnerships and cross-team delivery connect well to a role spanning sales, marketing and product.</td></tr><tr><th scope="row">Pricing ownership</th><td><span class="fit-label">Needs confirmation</span></td><td>It appears in the job description, but we haven’t confirmed it in your experience. Keep it out of your CV until we do.<br><button class="textbtn" data-prompt="Help me think through my pricing experience">Talk this through with Oppa →</button></td></tr><tr><th scope="row">Day-to-day work</th><td><span class="fit-label">Personal fit</span></td><td>This is a hands-on role at a small company. Consider the uncertainty and how much you want to build yourself.</td></tr></tbody></table></div></section><div class="decision"><span>You choose what deserves your energy.</span><button class="btn" data-action="later">Save for later</button><button class="btn primary" data-go="cv">Pursue & prepare my CV →</button></div></div>`,cv:()=>`<div class="workspace">${heading()}${steps('cv')}<div class="document-tools"><div><h2>Your story, tailored to this role.</h2><p>Highlighted text shows the focus of this sample draft.</p></div><a class="btn" href="output/pdf/career-oppa-sample-cv.pdf" target="_blank" rel="noopener">Open sample PDF ↗</a></div><div class="notice">Pricing ownership is left out. Only include experience you can explain and support.</div><article class="cv" aria-label="Sample tailored CV"><h2>Alex Morgan</h2><div>Go-to-market & growth leader</div><p class="contact">London, UK · alex@example.com · Fictional profile</p><h3>Profile</h3><p>Growth leader who connects customer insight, partnerships and product launches. Experienced in <span class="highlight">building early growth programs</span> and bringing teams together to turn strategy into delivery.</p><h3>Experience</h3><div class="row"><strong>Growth Lead · Example Studio</strong><small>2022–2026</small></div><ul><li>Led a product launch from initial customer research through positioning and cross-team delivery.</li><li><span class="highlight">Built a partner program</span> connecting sales and product teams around shared customer needs.</li><li>Introduced a regular review of experiments so the team could make decisions from evidence.</li></ul><div class="row"><strong>Partnerships Manager · Sample Company</strong><small>2019–2022</small></div><ul><li>Developed partner relationships and coordinated launch plans across commercial teams.</li><li>Translated customer feedback into practical changes to messaging and onboarding.</li></ul><h3>Relevant strengths</h3><p>Go-to-market planning · Partnerships · Product launches · Cross-team leadership · Growth experiments</p><h3>Education</h3><p>BA Business Management · Example University</p><p class="contact">Fictional CV for layout review. The linked PDF is a separate sample export.</p></article><div class="decision"><span>Ready when you’ve checked every claim.</span><button class="btn" data-prompt="Help me improve the opening paragraph">Refine with Oppa</button><button class="btn primary" data-action="track">Looks good — next step →</button></div></div>`};

function buildFixedWorkspace(){
 const wrapper=main.firstElementChild;if(!wrapper||['cv','home','roles','documents'].includes(view))return;

  }else if(node.classList.contains('cv')){
   const chunks=[];let chunk=[];

    }else{const article=document.createElement('article');article.className='cv';article.append(...chunk);items.push(article)}
   }
  }else items.push(node)
 }
 const stage=document.createElement('div');stage.className='fixed-stage';
 const pager=document.createElement('nav');pager.className='workspace-pager';pager.setAttribute('aria-label','Workspace pages');pager.innerHTML='<button class="btn" type="button">← Previous</button><span aria-live="polite"></span><button class="btn" type="button">Next →</button>';
 wrapper.replaceChildren(heading,stage,pager);if(decision)wrapper.append(decision);

 pager.firstElementChild.onclick=()=>displayPage(wrapper,wrapper._page-1);
 pager.lastElementChild.onclick=()=>displayPage(wrapper,wrapper._page+1);

}
function paginateWorkspace(){
 if(['review','cv','home','roles','documents'].includes(view))return;
 const wrapper=main.firstElementChild;if(!wrapper?._items)return;

 const stage=wrapper.querySelector('.fixed-stage');stage.replaceChildren();const pages=[];
 let page=document.createElement('section');page.className='workspace-page';stage.append(page);
 for(const original of wrapper._items){
  const node=original.cloneNode(true);page.append(node);
  if(page.getBoundingClientRect().height>stage.clientHeight&&page.children.length>1){node.remove();pages.push(page);page.hidden=true;page=document.createElement('section');page.className='workspace-page';stage.append(page);page.append(node)}
 }
 if(page.children.length)pages.push(page);
 for(const pg of pages){const sections=[...pg.querySelectorAll('.fit-table-section')];if(sections.length>1){const first=sections.shift();for(const section of sections){first.querySelector('tbody').append(...section.querySelectorAll('tbody tr'));section.remove()}}}
 wrapper._pages=pages;displayPage(wrapper,Math.min(wrapper._page,pages.length-1));
}
function displayPage(wrapper,index){
 const pages=wrapper._pages;if(index<0||index>=pages.length)return;wrapper._page=index;
 pages.forEach((p,i)=>p.hidden=i!==index);const pager=wrapper.querySelector('.workspace-pager');pager.hidden=pages.length<2;pager.children[1].textContent=`${index+1} of ${pages.length}`;pager.firstElementChild.disabled=index===0;pager.lastElementChild.disabled=index===pages.length-1;
}
new ResizeObserver(()=>{cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>{if(main.firstElementChild?.querySelector('.fixed-stage'))paginateWorkspace()})}).observe(main);

];
const mobileLibraryNav=()=>`<nav class="library-mobile-nav" aria-label="Browse workspace"><button data-go="home">Home</button><button data-go="roles">My roles</button><button data-go="documents">My documents</button></nav>`;
function fitScoreColor(score){return score>=8?'fit-score-green':score>=6?'fit-score-yellow':'fit-score-amber'}
function fitScoreLabel(score){return score>=8?'Excellent':score>=6?'Good':'OK'}
function roleRows(limit=matchingRoles.length){return matchingRoles.slice(0,limit).map((r,i)=>`<tr><td><strong>${r[0]}</strong><span>${r[1]}</span></td><td>${r[2]}</td><td><strong class="role-score">${r[5]}</strong><span class="tag ${fitScoreColor(r[5])}">${fitScoreLabel(r[5])}</span></td><td>${r[4]}</td><td><button class="textbtn" data-role-id="${i}">Review fit →</button></td></tr>`).join('')}
function rolesTable(limit){return `<table class="role-table matching-roles-table"><caption class="sr-only">Matching sample roles</caption><thead><tr><th scope="col">Role & company</th><th scope="col">Location</th><th scope="col">Fit score</th><th scope="col">Why it fits</th><th scope="col">Action</th></tr></thead><tbody>${roleRows(limit)}</tbody></table>`}
const originalHome=screens.home;
screens.home=()=>{const template=document.createElement('div');template.innerHTML=originalHome();const feature=template.querySelector('.feature').outerHTML;return `<div class="library-screen">${mobileLibraryNav()}<div class="library-heading row"><div><div class="overline">Your next chapter</div><h1>A little closer, every day.</h1></div><button class="btn" data-action="add">+ Add a role</button></div>${feature}<section class="library-section"><div class="row sectionline"><h2>Top 10 roles</h2><button class="textbtn" data-go="roles">View all 12 matching roles →</button></div><div class="library-scroll" tabindex="0" aria-label="Top ten matching roles">${rolesTable(10)}</div></section><p class="library-note">Sample scores out of 10 · Highest fit first · Not a prediction of getting hired.</p></div>`};
screens.roles=()=>`<div class="library-screen">${mobileLibraryNav()}<div class="library-heading"><div class="overline">Your opportunities</div><h1>All roles that fit you.</h1><p>Explore every match, including roles beyond your top 10.</p></div><div class="library-tools"><input id="role-search" type="search" aria-label="Search matching roles" placeholder="Search role, company or location"><select id="role-fit" aria-label="Filter by fit"><option value="">All matches</option><option>Excellent</option><option>Good</option><option>OK</option></select><span class="library-count" id="role-count">12 matching roles</span></div><section class="library-section"><div class="library-scroll" tabindex="0" aria-label="All matching roles">${rolesTable()}</div><p class="library-empty" id="roles-empty" hidden>No matches for these filters. Try a different search.</p></section><p class="library-note">Sample scores out of 10 · Experience, goals, pay, culture and warning signs · Real scoring is not connected.</p></div>`;
screens.documents=()=>`<div class="library-screen">${mobileLibraryNav()}<div class="library-heading"><div class="overline">Your application library</div><h1>My documents</h1><p>Keep every résumé version, portfolio and supporting document together.</p></div><div class="library-tools"><input id="doc-search" type="search" aria-label="Search documents" placeholder="Search documents or linked roles"><select id="doc-type" aria-label="Filter document type"><option value="">All documents</option>${[...new Set(careerDocuments.map(d=>d.type))].map(t=>`<option>${t}</option>`).join('')}</select><span class="library-count" id="doc-count">9 documents</span></div><section class="library-section"><div class="library-scroll" tabindex="0" aria-label="Career documents"><table class="role-table doc-table"><caption class="sr-only">Résumé versions and career documents</caption><thead><tr><th scope="col">Document</th><th scope="col">Type</th><th scope="col">Version / status</th><th scope="col">Action</th></tr></thead><tbody>${careerDocuments.map((d,i)=>`<tr><td><strong>${d.name}</strong><span class="doc-context">${d.role}</span></td><td><span class="doc-type">${d.type}</span></td><td>${d.version}</td><td><button class="textbtn" data-doc-id="${i}">Open →</button></td></tr>`).join('')}</tbody></table></div><p class="library-empty" id="docs-empty" hidden>No documents match these filters.</p></section><p class="library-note">Sample library. No personal documents have been uploaded or generated.</p></div>`;
const detailDialog=document.createElement('dialog');detailDialog.className='modal';detailDialog.innerHTML='<h2 id="library-detail-title"></h2><p class="detail-copy" id="library-detail-copy"></p><button class="btn primary" type="button">Close</button>';detailDialog.setAttribute('aria-labelledby','library-detail-title');document.body.append(detailDialog);detailDialog.querySelector('button').onclick=()=>detailDialog.close();
function showDetail(title,body){document.getElementById('library-detail-title').textContent=title;document.getElementById('library-detail-copy').textContent=body;detailDialog.showModal()}
document.addEventListener('click',event=>{const role=event.target.closest('[data-role-id]');if(role){const i=Number(role.dataset.roleId);if(i===0)render('review');else{const r=matchingRoles[i];showDetail(`${r[0]} · ${r[1]}`,`Sample fit score: ${r[5]} · ${fitScoreLabel(r[5])} · ${r[2]}

${r[4]}

Sample assessment. The Northstar role demonstrates the complete review and application flow.`)}}const doc=event.target.closest('[data-doc-id]');if(doc){const i=Number(doc.dataset.docId);if(i===1)render('cv');else{const d=careerDocuments[i];showDetail(d.name,`${d.type} · ${d.version}
${d.role}

${d.body}

Sample document preview.`)}}});
function filterLibrary(){if(view==='roles'){const query=document.getElementById('role-search').value.toLowerCase(),fit=document.getElementById('role-fit').value;let count=0;document.querySelectorAll('.library-scroll tbody tr').forEach((tr,i)=>{const r=matchingRoles[i];tr.hidden=!((r.join(' ')+' '+fitScoreLabel(r[5])).toLowerCase().includes(query)&&(!fit||fitScoreLabel(r[5])===fit));if(!tr.hidden)count++});document.getElementById('role-count').textContent=`${count} matching roles`;document.getElementById('roles-empty').hidden=count!==0}else if(view==='documents'){const query=document.getElementById('doc-search').value.toLowerCase(),type=document.getElementById('doc-type').value;let count=0;document.querySelectorAll('.doc-table tbody tr').forEach((tr,i)=>{const d=careerDocuments[i];tr.hidden=!(`${d.name} ${d.role}`.toLowerCase().includes(query)&&(!type||d.type===type));if(!tr.hidden)count++});document.getElementById('doc-count').textContent=`${count} documents`;document.getElementById('docs-empty').hidden=count!==0}}
document.addEventListener('input',e=>{if(['role-search','doc-search'].includes(e.target.id))filterLibrary()});document.addEventListener('change',e=>{if(['role-fit','doc-type'].includes(e.target.id))filterLibrary()});

render('home');
</script></body></html>
